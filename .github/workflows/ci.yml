name: Dark-Spot checks

on:
  push:
    branches:
      - work/mvp-foundation
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Create temporary test environment
        run: node -e "const fs=require('node:fs');const c=require('node:crypto');const nl=String.fromCharCode(10);fs.writeFileSync('.env','SESSION_SECRET='+c.randomBytes(48).toString('hex')+nl+'OWNER_SETUP_TOKEN='+c.randomBytes(48).toString('hex')+nl)"

      - name: Run MVP integration tests
        run: npm test

  windows-app:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows desktop app
        run: dotnet publish launcher/windows/DarkSpotControl.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Assemble portable app folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          New-Item -ItemType Directory -Force bundle/launcher | Out-Null
          Copy-Item publish/* bundle/ -Recurse -Force
          Copy-Item launcher/launcher.js bundle/launcher/launcher.js -Force
          Copy-Item server bundle/server -Recurse -Force
          Copy-Item client bundle/client -Recurse -Force
          Copy-Item node_modules bundle/node_modules -Recurse -Force
          Copy-Item package.json bundle/package.json -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Spot-Control-Windows-x64
          path: bundle/
          if-no-files-found: error
          retention-days: 30
